name: "Branch Naming Convention"

on:
  push:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Name
        run: |
          # Define the regex for allowed branch names
          # Example: feature/xyz, bugfix/xyz, hotfix/xyz, release/xyz
          PATTERN="^(feature|bugfix|hotfix|release)\/.*$"
          
          # Get the branch name based on the event type
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi

          echo "Checking branch name: $BRANCH_NAME"

          # Ignore main/master and other protected branches
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "master" || "$BRANCH_NAME" == "develop" ]]; then
            echo "Base branch detected, skipping check."
            exit 0
          fi

          # Validate against the regex
          if [[ ! "$BRANCH_NAME" =~ $PATTERN ]]; then
            echo "Error: Invalid branch name '$BRANCH_NAME'."
            echo "Branch names must match the pattern: $PATTERN"
            echo "Example: feature/add-new-cards"
            exit 1
          fi
          
          echo "Branch name is valid!"